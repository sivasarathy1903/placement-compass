server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: placement-compass-api
  data:
    mongodb:
      uri: mongodb://localhost:27017/placement_compass_db
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    time-zone: UTC
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
    com.placementcompass.api: DEBUG

app:
  jwt:
    # Base64 encoded secret key (56 bytes, fits HS256 key requirements)
    secret: "c2VjcmV0LWtleS1mb3ItcGxhY2VtZW50LWNvbXBhc3MtY2FyZWVyLXRyYWNrZXItYXBwbGljYXRpb24="
    access-token-expiration-ms: 86400000 # 24 Hours
    refresh-token-expiration-ms: 604800000 # 7 Days
